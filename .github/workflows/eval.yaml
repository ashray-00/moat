name: eval-gate
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "backend/app/**"
      - "backend/tests/**"
      - ".github/workflows/eval.yaml"
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install uv && uv pip install --system -e "backend[dev]"
      - name: offline eval gate (no DB / no LLM keys)
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/moat
        run: python -m app.evals.run --offline-only
  live:
    # Manual — full Ask + retrieval pipeline against a seeded DB.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: offline
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: moat }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install uv && uv pip install --system -e "backend[dev]"
      - name: apply schema
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d moat -f backend/app/ingest/schema.sql
      - name: seed eval tickers (EDGAR + embeddings)
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/moat
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python -m worker.seed --tickers=AAPL,NVDA,MSFT
      - name: live eval gate (fails below floors)
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/moat
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python -m app.evals.run --sample=40
        working-directory: backend
