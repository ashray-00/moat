# Local / single-host deploy skeleton (Postgres + Redis + API + ingest worker).
# Frontend still runs via `cd frontend && npm run dev` or your host's Next deploy.
#
#   cp .env.example .env   # set DATABASE_URL to postgresql+asyncpg://postgres:postgres@db:5432/moat
#   docker compose up --build
#
# Apply schema once:
#   docker compose exec db psql -U postgres -d moat -f - < backend/app/ingest/schema.sql
# Or from host with published port.

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: moat
    ports:
      - "5433:5432"
    volumes:
      - moat_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d moat"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/moat
      REDIS_URL: redis://redis:6379/0
      AUTH_REQUIRED: "true"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
    command: ["python", "-m", "worker.ingest"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/moat
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started

volumes:
  moat_pg:
